<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>VLM planner - frame annotation</title>
  <style>
    :root {
      --bg: #111417;
      --panel: #1b1f24;
      --border: #2b3138;
      --text: #e6e9ec;
      --muted: #8a939d;
      --accent: #4f8cff;
      --ok: #3ecf6e;
      --warn: #ffb454;
      --bad: #ff5d5d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: var(--muted);
    }

    .progress-wrap {
      flex: 1;
      height: 6px;
      background: var(--panel);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width .15s;
    }

    #progress-text {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .img-pane {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-width: 0;
      position: relative;
    }

    .img-pane img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .filename {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 11px;
      color: var(--muted);
      background: #0008;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .panel {
      width: 360px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .group h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.opt {
      flex: 1;
      min-width: 70px;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    button.opt:hover {
      border-color: var(--accent);
    }

    button.opt:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    button.opt:disabled:hover {
      border-color: var(--border);
    }

    button.opt.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.opt.active.ok {
      background: var(--ok);
      border-color: var(--ok);
    }

    button.opt.active.bad {
      background: var(--bad);
      border-color: var(--bad);
    }

    kbd {
      display: inline-block;
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 4px;
      margin-left: 6px;
      font-family: inherit;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .save-row {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .save-row button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    #save-btn {
      background: var(--ok);
      color: #062;
    }

    #save-btn:disabled {
      background: var(--panel);
      color: var(--muted);
      cursor: not-allowed;
    }

    #clear-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border) !important;
    }

    #skip-btn {
      background: var(--panel);
      color: var(--warn);
      border: 1px solid var(--border) !important;
    }

    #skip-btn.active {
      background: var(--warn);
      color: #422;
      border-color: var(--warn) !important;
    }

    #stats-group table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    #stats-group td {
      padding: 2px 0;
      color: var(--text);
    }

    #stats-group td.label {
      color: var(--muted);
    }

    #stats-group td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #stats-group tr.section td {
      padding-top: 10px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: .05em;
    }

    .nav-row {
      display: flex;
      gap: 8px;
    }

    .nav-row button {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }

    .disabled-note {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    #status {
      position: fixed;
      top: 10px;
      right: 16px;
      font-size: 12px;
      color: var(--ok);
      opacity: 0;
      transition: opacity .3s;
    }

    .thumbs-strip {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }

    .thumb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .thumb img {
      width: 128px;
      height: 96px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .thumb .thumb-label {
      font-size: 10px;
      color: var(--muted);
    }

    .thumbs-strip .hint {
      padding: 4px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>VLM PLANNER - ANNOTATE</h1>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="progress-text">–</div>
  </header>

  <main>
    <div class="img-pane">
      <img id="frame-img" src="" alt="">
      <div class="filename" id="frame-name"></div>
    </div>

    <div class="panel">
      <div class="group">
        <button id="copy-prev-btn" class="opt" data-act="copy-prev" style="width:100%">⟲ Copy previous label
          <kbd>R</kbd></button>
      </div>

      <div class="group">
        <h2>Frame type</h2>
        <div class="btn-row">
          <button class="opt" data-act="type:approach">Approach <kbd>A</kbd></button>
          <button class="opt" data-act="type:exit">Exit <kbd>E</kbd></button>
        </div>
      </div>

      <div class="group" id="approach-group" style="display:none">
        <h2>Junction possible?</h2>
        <div class="btn-row">
          <button class="opt" data-act="junction:yes">Possible <kbd>Y</kbd></button>
          <button class="opt" data-act="junction:no">Not possible <kbd>N</kbd></button>
        </div>
      </div>

      <div class="group" id="directions-group" style="display:none">
        <h2>Which directions are open</h2>
        <div class="btn-row">
          <button class="opt" data-act="dir:left">Left <kbd>1</kbd></button>
          <button class="opt" data-act="dir:straight">Straight <kbd>2</kbd></button>
          <button class="opt" data-act="dir:right">Right <kbd>3</kbd></button>
        </div>
        <p class="hint">Toggle each direction that leads onto an open road from this junction.</p>
      </div>

      <div class="group" id="turn-group" style="display:none">
        <h2>Which turn is this</h2>
        <div class="btn-row">
          <button class="opt" data-act="turn:left">Left <kbd>1</kbd></button>
          <button class="opt" data-act="turn:straight">Straight <kbd>2</kbd></button>
          <button class="opt" data-act="turn:right">Right <kbd>3</kbd></button>
        </div>
      </div>

      <div class="group" id="cleared-group" style="display:none">
        <h2>Has it cleared the junction?</h2>
        <div class="btn-row">
          <button class="opt" data-act="cleared:yes">Cleared <kbd>C</kbd></button>
          <button class="opt" data-act="cleared:no">Not yet <kbd>V</kbd></button>
        </div>
      </div>

      <div class="save-row">
        <button id="clear-btn" class="opt" data-act="clear">Clear</button>
        <button id="skip-btn" class="opt" data-act="skip">Skip <kbd>S</kbd></button>
        <button id="save-btn" data-act="save" disabled>Save &amp; next <kbd style="color:#052">Enter</kbd></button>
      </div>
      <div class="nav-row">
        <button data-act="prev">&larr; Prev</button>
        <button data-act="next">Next &rarr;</button>
        <button data-act="next-unlabeled">Next unlabeled</button>
      </div>

      <div class="group" id="stats-group">
        <h2>Sample counts</h2>
        <div id="stats-body" class="hint"></div>
      </div>
    </div>
  </main>

  <div class="thumbs-strip" id="thumbs-strip"></div>

  <div id="status">Saved</div>

  <script>
    let frames = [];
    let labels = {};
    let idx = 0;
    let draft = null;

    const el = (id) => document.getElementById(id);

    async function boot() {
      const [fRes, lRes] = await Promise.all([fetch('/api/frames'), fetch('/api/labels')]);
      frames = (await fRes.json()).frames;
      labels = await lRes.json();
      idx = firstUnlabeledIndex();
      render();
      document.addEventListener('click', onClick);
      document.addEventListener('keydown', onKey);
    }

    function firstUnlabeledIndex() {
      const i = frames.findIndex(f => !labels[f]);
      return i === -1 ? 0 : i;
    }

    function currentFrame() { return frames[idx]; }

    function blankDraft() { return { type: null }; }

    function render() {
      const frame = currentFrame();
      el('frame-img').src = '/images/' + frame;
      el('frame-name').textContent = frame;
      draft = labels[frame] ? structuredClone(labels[frame]) : blankDraft();
      renderPanel();
      renderProgress();
      renderThumbs();
    }

    function renderThumbs() {
      const strip = el('thumbs-strip');
      const upcoming = frames.slice(idx + 1, idx + 12);
      if (!upcoming.length) {
        strip.innerHTML = '<div class="hint">- end of sequence -</div>';
        return;
      }
      strip.innerHTML = upcoming.map((f, i) => `
    <div class="thumb">
      <img src="/images/${encodeURIComponent(f)}" loading="lazy" alt="${f}">
      <div class="thumb-label">+${i + 1}</div>
    </div>
  `).join('');
    }

    function renderProgress() {
      const s = computeStats();
      el('progress-text').textContent =
        `Frame ${idx + 1}/${frames.length} · ${s.approachN + s.exitN} labeled · ${s.skipped} skipped · ${s.total - s.handled} remaining`;
      el('progress-bar').style.width = (100 * s.handled / s.total) + '%';
      renderStats(s);
    }

    function computeStats() {
      const total = frames.length;
      let skipped = 0, approachN = 0, exitN = 0;
      let junctionYes = 0, junctionNo = 0;
      const dirOpen = { left: 0, straight: 0, right: 0 };
      const dirClosed = { left: 0, straight: 0, right: 0 };
      const turnCount = { left: 0, straight: 0, right: 0 };
      let clearedYes = 0, clearedNo = 0;

      for (const f of frames) {
        const l = labels[f];
        if (!l) continue;
        if (l.type === 'skip') { skipped++; continue; }
        if (l.type === 'approach') {
          approachN++;
          if (l.junction === 'yes') {
            junctionYes++;
            for (const d of ['left', 'straight', 'right']) {
              if (l.directions[d]) dirOpen[d]++; else dirClosed[d]++;
            }
          } else junctionNo++;
        } else if (l.type === 'exit') {
          exitN++;
          turnCount[l.turn] = (turnCount[l.turn] || 0) + 1;
          if (l.cleared) clearedYes++; else clearedNo++;
        }
      }
      const handled = approachN + exitN + skipped;
      return { total, handled, skipped, approachN, exitN, junctionYes, junctionNo, dirOpen, dirClosed, turnCount, clearedYes, clearedNo };
    }

    function row(label, val) {
      return `<tr><td class="label">${label}</td><td class="num">${val}</td></tr>`;
    }
    function section(title) {
      return `<tr class="section"><td colspan="2">${title}</td></tr>`;
    }

    function renderStats(s) {
      let html = '<table>';
      html += section(`Approach (${s.approachN})`);
      html += row('junction possible', s.junctionYes);
      html += row('junction not possible', s.junctionNo);
      html += row('left: open / closed', `${s.dirOpen.left} / ${s.dirClosed.left}`);
      html += row('straight: open / closed', `${s.dirOpen.straight} / ${s.dirClosed.straight}`);
      html += row('right: open / closed', `${s.dirOpen.right} / ${s.dirClosed.right}`);
      html += section(`Exit (${s.exitN})`);
      html += row('turn: left / straight / right', `${s.turnCount.left} / ${s.turnCount.straight} / ${s.turnCount.right}`);
      html += row('cleared / not yet', `${s.clearedYes} / ${s.clearedNo}`);
      html += section('Other');
      html += row('skipped', s.skipped);
      html += row('unlabeled', s.total - s.handled);
      html += '</table>';
      el('stats-body').innerHTML = html;
    }

    function setActive(selector, on) {
      const btn = document.querySelector(selector);
      if (btn) btn.classList.toggle('active', !!on);
    }

    function renderPanel() {
      document.querySelectorAll('button.opt').forEach(b => b.classList.remove('active'));
      el('approach-group').style.display = draft.type === 'approach' ? '' : 'none';
      el('directions-group').style.display = draft.type === 'approach' && draft.junction === 'yes' ? '' : 'none';
      el('turn-group').style.display = draft.type === 'exit' ? '' : 'none';
      el('cleared-group').style.display = draft.type === 'exit' ? '' : 'none';

      if (draft.type === 'skip') setActive('#skip-btn', true);
      if (draft.type) setActive(`[data-act="type:${draft.type}"]`, true);
      if (draft.type === 'approach') {
        if (draft.junction) setActive(`[data-act="junction:${draft.junction}"]`, true);
        if (draft.junction === 'yes' && draft.directions) {
          for (const d of ['left', 'straight', 'right']) {
            setActive(`[data-act="dir:${d}"]`, draft.directions[d]);
          }
        }
      } else if (draft.type === 'exit') {
        if (draft.turn) setActive(`[data-act="turn:${draft.turn}"]`, true);
        if (draft.cleared === true) setActive('[data-act="cleared:yes"]', true);
        if (draft.cleared === false) setActive('[data-act="cleared:no"]', true);
      }

      el('save-btn').disabled = !canSave();

      const prevLabel = idx > 0 ? labels[frames[idx - 1]] : null;
      const copyBtn = el('copy-prev-btn');
      copyBtn.disabled = !prevLabel;
      copyBtn.innerHTML = prevLabel
        ? `⟲ Copy previous (${summarizeLabel(prevLabel)}) <kbd>R</kbd>`
        : '⟲ Copy previous label <kbd>R</kbd>';
    }

    function summarizeLabel(l) {
      if (l.type === 'skip') return 'skip';
      if (l.type === 'approach') {
        if (l.junction === 'no') return 'not possible';
        const open = ['left', 'straight', 'right'].filter(d => l.directions[d]);
        return `possible · open: ${open.join(',') || 'none'}`;
      }
      if (l.type === 'exit') return `${l.turn} · ${l.cleared ? 'cleared' : 'not yet'}`;
      return '';
    }

    function canSave() {
      if (draft.type === 'skip') return true;
      if (draft.type === 'approach') {
        if (draft.junction === 'no') return true;
        if (draft.junction === 'yes') return !!draft.directions;
        return false;
      }
      if (draft.type === 'exit') {
        return !!draft.turn && typeof draft.cleared === 'boolean';
      }
      return false;
    }

    function act(action) {
      const [kind, val] = action.split(':');
      if (kind === 'type') {
        draft = val === 'approach' ? { type: 'approach' } : { type: 'exit' };
      } else if (kind === 'junction') {
        draft.junction = val;
        if (val === 'yes' && !draft.directions) draft.directions = { left: false, straight: false, right: false };
        if (val === 'no') delete draft.directions;
      } else if (kind === 'dir') {
        if (draft.type === 'approach' && draft.junction === 'yes') {
          draft.directions[val] = !draft.directions[val];
        }
      } else if (kind === 'turn') {
        draft.turn = val;
      } else if (kind === 'cleared') {
        draft.cleared = (val === 'yes');
      } else if (action === 'clear') {
        draft = blankDraft();
      } else if (action === 'skip') {
        draft = { type: 'skip' };
        save();
        return;
      } else if (action === 'copy-prev') {
        if (idx === 0) return;
        const prevLabel = labels[frames[idx - 1]];
        if (!prevLabel) return;
        draft = structuredClone(prevLabel);
      } else if (action === 'save') {
        save();
        return;
      } else if (action === 'prev') {
        idx = Math.max(0, idx - 1); render(); return;
      } else if (action === 'next') {
        idx = Math.min(frames.length - 1, idx + 1); render(); return;
      } else if (action === 'next-unlabeled') {
        idx = firstUnlabeledIndex(); render(); return;
      }
      renderPanel();
    }

    async function save() {
      if (!canSave()) return;
      const frame = currentFrame();
      const res = await fetch('/api/labels/' + encodeURIComponent(frame), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(draft),
      });
      if (!res.ok) { alert('save failed: ' + await res.text()); return; }
      labels[frame] = draft;
      flashStatus();
      idx = Math.min(frames.length - 1, idx + 1);
      render();
    }

    function flashStatus() {
      const s = el('status');
      s.style.opacity = 1;
      setTimeout(() => s.style.opacity = 0, 500);
    }

    function onClick(e) {
      const btn = e.target.closest('[data-act]');
      if (btn) act(btn.dataset.act);
    }

    function onKey(e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const map = {
        'a': 'type:approach', 'e': 'type:exit', 's': 'skip', 'r': 'copy-prev',
        'y': 'junction:yes', 'n': 'junction:no',
        'c': 'cleared:yes', 'v': 'cleared:no',
        'Enter': 'save', 'Backspace': 'clear',
        'ArrowLeft': 'prev', 'ArrowRight': 'next',
      };
      if (e.key === '1' || e.key === '2' || e.key === '3') {
        const d = { '1': 'left', '2': 'straight', '3': 'right' }[e.key];
        if (draft.type === 'approach') act('dir:' + d);
        else if (draft.type === 'exit') act('turn:' + d);
        e.preventDefault();
        return;
      }
      if (map[e.key]) { act(map[e.key]); e.preventDefault(); }
    }

    boot();
  </script>
</body>

</html>
